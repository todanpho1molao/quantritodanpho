function openForm(path,id=null){const c=configs[path],rows=data[c.key],record=id?rows.find(r=>r.id===id):null;editing=record?{path,id}:null;activeDataKey=c.key;$("#modalTitle").textContent=record?"Cập nhật hồ sơ":c.add;$("#modalBody").innerHTML=`<form id="recordForm" class="form-grid">${c.fields.map(([key,label,type,opts])=>`<div class="field-group"><label class="field-label" for="f_${key}">${label}${key==="address"||key==="name"?` <span class="required">*</span>`:""}</label>${type==="select"?`<select class="control" id="f_${key}" name="${key}">${opts.map(o=>`<option ${record?.[key]===o?"selected":""}>${o}</option>`).join("")}</select>`:`<input class="control" id="f_${key}" name="${key}" type="${type}" value="${esc(record?.[key]??"")}" ${key==="address"||key==="name"?"required":""} ${type==="number"?'min="0"':''}>`}<div class="field-error">Vui lòng nhập thông tin này.</div></div>`).join("")}</form><div class="notice">${icon("info")}<span>Biểu mẫu minh họa. Dữ liệu chỉ được lưu tạm trong bộ nhớ của trang.</span></div>`;$("#modalFoot").innerHTML=`<button class="button button-secondary" onclick="closeModal()">Hủy</button><button class="button button-primary" onclick="saveRecord('${path}')">${icon("check")} Lưu thông tin</button>`;$("#modalBackdrop").classList.add("open");setTimeout(()=>$("#modalBody input")?.focus(),40)}
function saveRecord(path){const c=configs[path],form=$("#recordForm");if(!form.reportValidity())return;const obj=Object.fromEntries(new FormData(form).entries());if(obj.rooms)obj.rooms=Number(obj.rooms);if(editing){const r=data[c.key].find(x=>x.id===editing.id);Object.assign(r,obj,{updated:"25/11/2026"});toast("Đã cập nhật hồ sơ mẫu")}else{data[c.key].unshift({id:Math.max(0,...data[c.key].map(x=>x.id))+1,...obj,status:"active",updated:"25/11/2026"});toast("Đã thêm hồ sơ mẫu")}closeModal();render()}
function closeModal(){$("#modalBackdrop").classList.remove("open");editing=null}
function viewRecord(path,id){const c=configs[path],r=data[c.key].find(x=>x.id===id);if(!r)return;$("#modalTitle").textContent="Thông tin hồ sơ";$("#modalBody").innerHTML=`<div class="form-grid">${Object.entries(r).filter(([k])=>k!=="id").map(([k,v])=>`<div><div class="field-label muted">${({address:"Địa chỉ",owner:"Người phụ trách",phone:"Liên hệ",rooms:"Số phòng",occupancy:"Tình trạng sử dụng",name:"Tên cơ sở",type:"Ngành nghề",area:"Vị trí",capacity:"Quy mô",manager:"Đơn vị phụ trách",status:"Trạng thái",updated:"Cập nhật lần cuối"})[k]||k}</div><div style="font-size:12px;font-weight:650">${k==="status"?statusPill(v):esc(v)}</div></div>`).join("")}</div>`;$("#modalFoot").innerHTML=`<button class="button button-secondary" onclick="closeModal()">Đóng</button><button class="button button-primary" onclick="closeModal();openForm('${path}',${id})">${icon("edit")} Chỉnh sửa</button>`;$("#modalBackdrop").classList.add("open")}
function exportCsv(path){const c=configs[path],rows=data[c.key];const cols=c.columns.map(x=>x[0]);const csv=[cols.join(","),...rows.map(r=>cols.map(k=>'"'+String(r[k]??"").replace(/"/g,'""')+'"').join(","))].join("\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`tdp-${c.key}-demo.csv`;a.click();URL.revokeObjectURL(a.href);toast("Đã xuất CSV dữ liệu mẫu")}
function closeSidebar(){$("#sidebar").classList.remove("open");$("#overlay").classList.remove("show")}
document.querySelectorAll(".nav-link").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.route)));
$("#menuToggle").addEventListener("click",()=>{$("#sidebar").classList.toggle("open");$("#overlay").classList.toggle("show")});$("#overlay").addEventListener("click",closeSidebar);
$("#themeToggle").addEventListener("click",()=>{const next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;localStorage.setItem("tdp-theme",next);$("#themeIcon").innerHTML=next==="dark"?'<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'});
const savedTheme=localStorage.getItem("tdp-theme");if(savedTheme)document.documentElement.dataset.theme=savedTheme;
$("#modalClose").addEventListener("click",closeModal);$("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeSidebar()}});
$("#helpButton").addEventListener("click",()=>toast("TDP Digital V3 · Giao diện nguyên mẫu, chưa kết nối backend"));
render();
</script>
</body></html>
